<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:aidoc="urn:aidoc:assets"
  viewBox="0 0 1280 640"
  role="img"
  aria-labelledby="title desc"
  data-visual-system="dimensional-code-to-docs-v1"
>
  <title id="title">AiDoc storefront social preview</title>
  <desc id="desc">A graphite code repository sends a createUser signature change through a cyan analysis path to README and API documentation, ending at a green validated state. Documentation that keeps up with your code.</desc>
  <metadata>
    <aidoc:copy>
      <aidoc:line>AiDoc</aidoc:line>
      <aidoc:line>Documentation that keeps up with your code.</aidoc:line>
      <aidoc:line>Code change -> Impact plan -> Reviewable docs update</aidoc:line>
    </aidoc:copy>
  </metadata>
  <image
    href="aidoc-social-preview-source.png"
    x="0"
    y="0"
    width="1280"
    height="640"
    preserveAspectRatio="xMidYMid slice"
  />
  <g data-visible-code="before">
    <rect x="176" y="228" width="198" height="44" fill="#202A34" />
    <text
      x="188"
      y="258"
      fill="#FAF7F0"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="18"
      font-weight="650"
      textLength="166"
      lengthAdjust="spacingAndGlyphs"
    ><tspan>createUser(</tspan><tspan fill="#20B8F4">email</tspan><tspan>)</tspan></text>
  </g>
  <g data-visible-code="after">
    <rect x="176" y="353" width="205" height="44" fill="#202A34" />
    <text
      x="188"
      y="383"
      fill="#FAF7F0"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="16.5"
      font-weight="650"
      letter-spacing="-1.8"
    ><tspan>createUser(</tspan><tspan fill="#20B8F4">email</tspan><tspan>, </tspan><tspan fill="#2AC769">role</tspan><tspan>)</tspan></text>
  </g>
</svg>
