    <text x="92" y="86" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" letter-spacing="2">SEMANTIC ANALYSIS</text>
    <text x="1032" y="58" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" text-anchor="end">2 / 5</text>
