    <text x="72" y="430" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" letter-spacing="2">SOURCE DELTA</text>
    <text x="72" y="476" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28">role added</text>

    <path d="M360 445H410" stroke="#58A6FF" stroke-width="4" stroke-linecap="round"/>
    <path d="M396 429L414 445L396 461" fill="none" stroke="#58A6FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

