<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-safe-margin="64" data-protected-margin="80" data-step="3">
  <title id="title">AiDoc frame 3: bounded draft</title>
  <desc id="desc">Relevant change context enters a host-owned draft through prepare_documentation_update with no provider calls by AiDoc.</desc>
  <rect width="1280" height="720" fill="#0D1117"/>
  <g data-content-area="safe" transform="translate(64 64)">
    <rect width="1152" height="592" rx="28" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <g transform="translate(28 18) scale(0.68)">
      <path d="M14 7h25l11 11v39H14z" fill="#161B22" stroke="#F0F6FC" stroke-width="3" stroke-linejoin="round"/>
      <path d="M39 7v12h11" fill="none" stroke="#F0F6FC" stroke-width="3" stroke-linejoin="round"/>
      <path d="M24 29v14m0-7h15m0-7v14" fill="none" stroke="#58A6FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="24" cy="29" r="4" fill="#58A6FF"/>
      <circle cx="24" cy="43" r="4" fill="#3FB950"/>
      <circle cx="39" cy="29" r="4" fill="#58A6FF"/>
      <circle cx="39" cy="43" r="4" fill="#3FB950"/>
    </g>
    <text x="80" y="50" fill="#F0F6FC" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700">AiDoc</text>
    <text x="1104" y="50" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" text-anchor="end">3 / 5</text>
    <path d="M32 82H1120" stroke="#30363D" stroke-width="2"/>

    <text x="40" y="142" fill="#F0F6FC" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" font-weight="750">Bounded draft</text>
    <text x="40" y="184" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28">Only relevant context enters the host draft.</text>

    <rect x="48" y="228" width="416" height="244" rx="20" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
    <text x="80" y="274" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="650">Relevant context</text>
    <text x="80" y="330" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30">createUser(email, role)</text>
    <text x="80" y="382" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30">README.md</text>
    <text x="80" y="430" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30">docs/API.md</text>

    <path d="M488 350H638" stroke="#58A6FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M620 332l20 18-20 18" fill="none" stroke="#58A6FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="664" y="228" width="440" height="244" rx="20" fill="#0D1117" stroke="#58A6FF" stroke-width="3"/>
    <text x="696" y="274" fill="#58A6FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="650">Host-owned draft</text>
    <path d="M696 304H1072" stroke="#30363D" stroke-width="2"/>
    <text x="696" y="354" fill="#F0F6FC" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30">Focused Markdown draft</text>
    <text x="696" y="406" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28">The host owns this step.</text>

    <text x="48" y="526" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">prepare_documentation_update</text>
    <rect x="824" y="492" width="280" height="54" rx="27" fill="#12261A" stroke="#3FB950" stroke-width="2"/>
    <circle cx="858" cy="519" r="8" fill="#3FB950"/>
    <text x="882" y="529" fill="#3FB950" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="650">No provider calls</text>
  </g>
