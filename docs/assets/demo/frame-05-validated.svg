    <text x="40" y="184" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28">Validation stops before any repository write.</text>

    <rect x="48" y="250" width="304" height="188" rx="20" fill="#0D1117" stroke="#3FB950" stroke-width="3"/>
