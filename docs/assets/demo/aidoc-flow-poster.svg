<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AiDoc canonical storefront demo</title>
  <desc id="desc">A code signature change maps to README.md and docs/API.md, then reaches a validated state without provider calls or repository writes.</desc>
  <rect width="1280" height="720" fill="#0D1117"/>
  <rect x="80" y="64" width="1120" height="592" rx="28" fill="#161B22" stroke="#8B949E" stroke-opacity="0.28" stroke-width="2"/>
  <path d="M112 168H1168" stroke="#8B949E" stroke-opacity="0.28" stroke-width="2"/>
  <g transform="translate(112 98) scale(0.75)">
    <path d="M14 7h25l11 11v39H14z" fill="#161B22" stroke="#F0F6FC" stroke-width="3" stroke-linejoin="round"/>
    <path d="M39 7v12h11" fill="none" stroke="#F0F6FC" stroke-width="3" stroke-linejoin="round"/>
    <path d="M24 29v14m0-7h15m0-7v14" fill="none" stroke="#58A6FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="29" r="4" fill="#58A6FF"/>
    <circle cx="24" cy="43" r="4" fill="#3FB950"/>
    <circle cx="39" cy="29" r="4" fill="#58A6FF"/>
    <circle cx="39" cy="43" r="4" fill="#3FB950"/>
  </g>
  <text x="180" y="132" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="600">AiDoc</text>
  <text x="180" y="156" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="1">CANONICAL STOREFRONT DEMO</text>

  <g>
    <rect x="112" y="212" width="312" height="346" rx="20" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
    <text x="144" y="258" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="1">CODE CHANGE</text>
    <path d="M144 290H392" stroke="#8B949E" stroke-opacity="0.28" stroke-width="2"/>
    <text x="144" y="340" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">createUser(email)</text>
    <path d="M144 374H392" stroke="#8B949E" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M168 408H352" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
    <path d="M334 398l18 10-18 10" fill="none" stroke="#58A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="144" y="464" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">createUser(email, role)</text>
    <circle cx="152" cy="514" r="6" fill="#58A6FF"/>
    <text x="172" y="520" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">signature updated</text>
  </g>

  <g>
    <rect x="452" y="212" width="312" height="346" rx="20" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
    <text x="484" y="258" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="1">IMPACT PLAN</text>
    <path d="M484 290H732" stroke="#8B949E" stroke-opacity="0.28" stroke-width="2"/>
    <rect x="484" y="322" width="248" height="58" rx="12" fill="#161B22" stroke="#8B949E" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="510" cy="351" r="7" fill="#58A6FF"/>
    <text x="532" y="358" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">README.md</text>
    <rect x="484" y="402" width="248" height="58" rx="12" fill="#161B22" stroke="#8B949E" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="510" cy="431" r="7" fill="#58A6FF"/>
    <text x="532" y="438" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">docs/API.md</text>
    <text x="484" y="510" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">two affected documents</text>
  </g>

  <g>
    <rect x="792" y="212" width="344" height="346" rx="20" fill="#0D1117" stroke="#3FB950" stroke-width="2"/>
    <text x="824" y="258" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="1">VALIDATION</text>
    <path d="M824 290H1104" stroke="#8B949E" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M824 332H1090" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
    <path d="M824 362H1048" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
    <path d="M824 392H1074" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1100" cy="332" r="7" fill="#3FB950"/>
    <circle cx="1058" cy="362" r="7" fill="#3FB950"/>
    <circle cx="1084" cy="392" r="7" fill="#3FB950"/>
    <text x="824" y="464" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">prepare -&gt; host draft -&gt; validate</text>
    <text x="824" y="500" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">Provider calls: none</text>
    <text x="824" y="526" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">Repository writes: none</text>
    <text x="824" y="548" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="600">Validated</text>
  </g>
</svg>
