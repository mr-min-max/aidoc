<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:aidoc="urn:aidoc:assets"
  viewBox="0 0 1280 720"
  role="img"
  aria-labelledby="title desc"
  data-visual-system="dimensional-code-to-docs-v1"
>
  <title id="title">AiDoc code-to-docs review flow</title>
  <desc id="desc">A graphite repository layer shows createUser gaining a role, two documentation targets, and a warm-white AiDoc document. The deterministic demo makes no provider calls or repository writes, and the maintainer decides what is applied.</desc>
  <metadata>
    <aidoc:contract>
      <aidoc:fact>createUser(email)</aidoc:fact>
      <aidoc:fact>createUser(email, role)</aidoc:fact>
      <aidoc:fact>README.md</aidoc:fact>
      <aidoc:fact>docs/API.md</aidoc:fact>
      <aidoc:fact>Validated</aidoc:fact>
      <aidoc:fact>No provider calls</aidoc:fact>
      <aidoc:fact>No repository writes</aidoc:fact>
      <aidoc:fact>You decide what is applied</aidoc:fact>
    </aidoc:contract>
  </metadata>
  <rect width="1280" height="720" fill="#0E141B" />
  <image
    href="aidoc-flow-poster-source.png"
    x="0"
    y="0"
    width="1280"
    height="640"
    preserveAspectRatio="xMidYMid slice"
  />
  <rect x="0" y="640" width="1280" height="80" fill="#111922" />
  <path d="M40 640H1240" stroke="#34404C" stroke-width="2" />
  <circle cx="58" cy="680" r="8" fill="#2AC769" />
  <text x="82" y="690" fill="#FAF7F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="650">No provider calls</text>
  <circle cx="405" cy="680" r="8" fill="#20B8F4" />
  <text x="429" y="690" fill="#FAF7F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="650">No repository writes</text>
  <circle cx="800" cy="680" r="8" fill="#2AC769" />
  <text x="824" y="690" fill="#FAF7F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="650">You decide what is applied</text>
</svg>
