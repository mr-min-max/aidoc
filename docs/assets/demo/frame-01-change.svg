<svg xmlns="http://www.w3.org/2000/svg" xmlns:aidoc="urn:aidoc:assets" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-safe-margin="64" data-protected-margin="80" data-step="1" data-visual-system="dimensional-code-to-docs-v1">
  <title id="title">AiDoc demo step 1: Code changed</title>
  <desc id="desc">The createUser signature changes from one argument to two while later documentation stages remain visible but subdued.</desc>
  <metadata><aidoc:evidence><aidoc:fact>createUser(email)</aidoc:fact><aidoc:fact>createUser(email, role)</aidoc:fact></aidoc:evidence></metadata>
  <rect width="1280" height="720" fill="#F4F1EA"/>
  <g data-content-area="safe" transform="translate(64 64)">
    <rect width="1152" height="592" rx="32" fill="#FAF7F0" stroke="#D7D1C7" stroke-width="2"/>
    <image href="aidoc-flow-scene.png" x="0" y="16" width="1152" height="576" preserveAspectRatio="xMidYMid slice"/>
    <rect x="450" y="200" width="702" height="320" fill="#FAF7F0" fill-opacity="0.64"/>
    <rect x="22" y="224" width="432" height="278" rx="24" fill="#20B8F4" fill-opacity="0.04" stroke="#20B8F4" stroke-width="4"/>
    <rect x="0" y="0" width="1152" height="202" rx="32" fill="#FAF7F0"/>
    <path d="M32 190H1120" stroke="#D7D1C7" stroke-width="2"/>
    <circle cx="36" cy="44" r="10" fill="#2AC769"/>
    <text x="60" y="56" fill="#202933" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="36" font-weight="700">AiDoc</text>
    <text x="32" y="124" fill="#202933" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="760">Code changed</text>
    <text x="32" y="170" fill="#58636E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="600">createUser(email) -> createUser(email, role)</text>
    <text x="1120" y="56" fill="#7D868D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="650" text-anchor="end">1 / 5</text>
    <rect x="0" y="520" width="1152" height="72" fill="#111922" fill-opacity="0.97"/>
    <circle cx="36" cy="556" r="8" fill="#2AC769"/>
