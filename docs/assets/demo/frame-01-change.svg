<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-safe-margin="64">
  <title id="title">AiDoc frame 1: signature change</title>
  <desc id="desc">The createUser signature changes from one argument to an email and role pair.</desc>
