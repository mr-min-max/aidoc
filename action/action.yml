name: 'aidoc — AI Documentation Generator'
description: 'Automatically generate and validate documentation (README, API docs, changelogs) using AI-powered code analysis in your CI/CD pipeline.'
author: 'aidoc contributors'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  provider:
    description: 'LLM provider to use (openai, anthropic, ollama)'
    required: false
    default: 'openai'
  api-key:
    description: 'API key for the LLM provider'
    required: false
  model:
    description: 'Model to use (e.g., gpt-4o-mini, claude-sonnet-4-20250514)'
    required: false
  commands:
    description: 'Comma-separated list of commands to run (readme,api,changelog,diagram)'
    required: false
    default: 'readme'
  mode:
    description: 'Operation mode: "generate" (create docs), "check" (fail CI if docs are stale), "review" (comment on a PR with the documentation impact of its changes)'
    required: false
    default: 'generate'
  review-target:
    description: 'Documentation file that "review" mode checks changed exports against'
    required: false
    default: 'README.md'
  comment-on-pr:
    description: 'In "review" mode, post the review as a pull request comment'
    required: false
    default: 'true'
  fail-on-issues:
    description: 'In "review" mode, fail the job when documentation gaps are found'
    required: false
    default: 'false'
  output-dir:
    description: 'Output directory for generated documentation'
    required: false
    default: './docs'
  auto-commit:
    description: 'Automatically commit generated documentation changes'
    required: false
    default: 'false'
  dry-run:
    description: 'Preview changes without writing files'
    required: false
    default: 'false'

outputs:
  changed:
    description: 'Whether documentation was updated (true/false)'
  files:
    description: 'List of files that were changed'
  summary:
    description: 'Human-readable summary of what was generated'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install aidoc
      shell: bash
      run: npm install -g aidoc-gen

    - name: Run aidoc documentation review
      if: inputs.mode == 'review'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Determine what to diff against. For pull_request events, compare the
        # PR's merge base with the head so we review exactly the PR's changes.
        BASE_REF="${GITHUB_BASE_REF:-}"
        SINCE="HEAD~1"
        if [ -n "$BASE_REF" ]; then
          git fetch origin "$BASE_REF" --depth=100 || true
          if MB=$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null); then
            SINCE="$MB"
          else
            SINCE="origin/$BASE_REF"
          fi
        fi
        echo "🔎 Reviewing documentation impact since: $SINCE"

        REVIEW_ARGS="review --since $SINCE --target ${{ inputs.review-target }}"
        if [ "${{ inputs.fail-on-issues }}" = "true" ]; then
          REVIEW_ARGS="$REVIEW_ARGS --fail-on-issues"
        fi

        # The report is Markdown on stdout; the spinner uses stderr.
        set +e
        aidoc $REVIEW_ARGS > review.md
        REVIEW_EXIT=$?
        set -e
        cat review.md

        if [ "${{ inputs.comment-on-pr }}" = "true" ] && [ -n "${GITHUB_EVENT_PATH:-}" ]; then
          PR_NUMBER=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$PR_NUMBER" ]; then
            # Update our previous comment when possible, otherwise create one.
            gh pr comment "$PR_NUMBER" --body-file review.md --edit-last 2>/dev/null \
              || gh pr comment "$PR_NUMBER" --body-file review.md
          fi
        fi

        exit $REVIEW_EXIT

    - name: Run aidoc commands
      if: inputs.mode != 'review'
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        AIDOC_PROVIDER: ${{ inputs.provider }}
        AIDOC_MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail

        MODE="${{ inputs.mode }}"
        COMMANDS="${{ inputs.commands }}"
        DRY_RUN="${{ inputs.dry-run }}"
        OUTPUT_DIR="${{ inputs.output-dir }}"
        CHANGED_FILES=""
        HAS_CHANGES="false"
        SUMMARY=""

        IFS=',' read -ra CMD_ARRAY <<< "$COMMANDS"

        for cmd in "${CMD_ARRAY[@]}"; do
          cmd=$(echo "$cmd" | xargs) # trim whitespace
          echo "🤖 Running: aidoc $cmd"

          case "$cmd" in
            readme)
              OUTPUT_FILE="./README.md"
              ;;
            api)
              OUTPUT_FILE="$OUTPUT_DIR/API.md"
              ;;
            changelog)
              OUTPUT_FILE="./CHANGELOG.md"
              ;;
            diagram)
              OUTPUT_FILE="$OUTPUT_DIR/architecture.md"
              ;;
            *)
              echo "⚠️  Unknown command: $cmd, skipping"
              continue
              ;;
          esac

          if [ "$MODE" = "check" ]; then
            # In check mode, generate to temp and compare
            TEMP_FILE=$(mktemp)
            aidoc "$cmd" --output "$TEMP_FILE" --mock 2>&1 || true

            if [ -f "$OUTPUT_FILE" ]; then
              if ! diff -q "$TEMP_FILE" "$OUTPUT_FILE" > /dev/null 2>&1; then
                echo "❌ Documentation is stale: $OUTPUT_FILE"
                HAS_CHANGES="true"
                SUMMARY="$SUMMARY\n- $OUTPUT_FILE is out of date"
              else
                echo "✅ Documentation is up to date: $OUTPUT_FILE"
              fi
            else
              echo "❌ Documentation missing: $OUTPUT_FILE"
              HAS_CHANGES="true"
              SUMMARY="$SUMMARY\n- $OUTPUT_FILE does not exist"
            fi
            rm -f "$TEMP_FILE"
          else
            # Generate mode
            ARGS="--output $OUTPUT_FILE"
            if [ "$DRY_RUN" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            aidoc "$cmd" $ARGS --mock 2>&1 || true
            CHANGED_FILES="$CHANGED_FILES $OUTPUT_FILE"
            SUMMARY="$SUMMARY\n- Generated $OUTPUT_FILE via 'aidoc $cmd'"
          fi
        done

        # Set outputs
        echo "changed=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
        echo "files=$CHANGED_FILES" >> "$GITHUB_OUTPUT"
        echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

        if [ "$MODE" = "check" ] && [ "$HAS_CHANGES" = "true" ]; then
          echo ""
          echo "❌ Documentation check failed. Run 'aidoc' locally to update."
          exit 1
        fi

    - name: Auto-commit changes
      if: inputs.auto-commit == 'true' && inputs.mode != 'check' && inputs.mode != 'review' && inputs.dry-run != 'true'
      shell: bash
      run: |
        git config user.name "aidoc[bot]"
        git config user.email "aidoc[bot]@users.noreply.github.com"
        git add -A
        git diff --staged --quiet || git commit -m "docs: update documentation via aidoc [skip ci]"
        git push || echo "⚠️  Could not push changes. You may need to set up write permissions."
