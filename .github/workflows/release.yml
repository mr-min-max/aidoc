name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Verify protected Git identities
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name mr-min-max
          git config --local user.email 254284659+mr-min-max@users.noreply.github.com
          node scripts/public-beta-preflight.mjs --json --candidate-ref HEAD --skip-source-artifacts --main-ref origin/main
      - run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match v$package_version" >&2
            exit 1
          fi
      - run: npm run verify:release
      - name: Pack release artifact
        if: matrix.node-version == 24
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/aidoc-package"
          mkdir -p "$artifact_dir"
          npm pack --json --pack-destination "$artifact_dir" \
            > "$artifact_dir/pack.json"
          filename="$(node -e "const fs=require('fs'); const p=process.argv[1]; const files=JSON.parse(fs.readFileSync(p, 'utf8')); if (files.length !== 1 || !files[0].filename) throw new Error('Expected exactly one packed tarball'); process.stdout.write(files[0].filename)" "$artifact_dir/pack.json")"
          tarball="$artifact_dir/$filename"
          checksum="$tarball.sha256"
          (
            cd "$artifact_dir"
            sha256sum "$filename" > "$filename.sha256"
          )
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Smoke exact release artifact
        if: matrix.node-version == 24
        env:
          AIDOC_TEST_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          npm run test:package
          npm run test:mcp
      - name: Upload verified artifact
        if: matrix.node-version == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aidoc-npm-package
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.checksum }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidoc-npm-package
          path: ${{ runner.temp }}/aidoc-artifact
      - name: Validate verified artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aidoc-artifact"
          shopt -s nullglob
          tarballs=(*.tgz)
          checksums=(*.sha256)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one verified tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          if [ "${#checksums[@]}" -ne 1 ]; then
            echo "Expected exactly one checksum, found ${#checksums[@]}" >&2
            exit 1
          fi
          if [ "${checksums[0]}" != "${tarballs[0]}.sha256" ]; then
            echo "Checksum does not match the verified tarball name" >&2
            exit 1
          fi
          sha256sum --check --strict "${checksums[0]}"
          echo "tarball=$PWD/${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Publish verified artifact
        run: npm publish "${{ steps.artifact.outputs.tarball }}" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
