# Keep CI on the default branch so pushes and pull requests share one gate.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Verify protected Git identities
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name mr-min-max
          git config --local user.email 254284659+mr-min-max@users.noreply.github.com
          node scripts/public-beta-preflight.mjs --json --candidate-ref HEAD --skip-source-artifacts --main-ref origin/main
      - run: npm ci
      - run: npm run verify:release
      - run: node dist/cli/index.js score --min 80
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node-version == 22
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
