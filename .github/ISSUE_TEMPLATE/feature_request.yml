name: ✨ Feature Request
description: Suggest a new feature or improvement for aidoc
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Tell us what you'd like to see in aidoc.
  - type: input
    id: version
    attributes:
      label: aidoc version or commit
      description: Provide the source-beta version or exact Git commit used for this request.
      placeholder: "0.2.0-beta.3 or commit SHA"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version` in the same environment.
      placeholder: "22.x"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? Include CLI examples if applicable.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - New CLI command
        - Parser (new language support)
        - LLM Provider
        - GitHub Action
        - MCP Server
        - Output/Templates
        - Configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative approaches have you tried?
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      description: What observable behavior would make this complete?
  - type: textarea
    id: verification
    attributes:
      label: Focused tests and release-gate evidence
      description: If you have an implementation, list focused tests and the result of `npm run verify:release`.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a PR for this feature
